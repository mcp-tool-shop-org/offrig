# cargo-deny policy. Run: cargo deny check
# Permissive licences are allowed everywhere. Anything weaker is an exception
# scoped to the one crate that carries it, so a new copyleft dependency fails CI.

# Audit what we ship. offrig's release is Windows-only (offrig-<ver>-windows-x64.zip),
# so cargo-deny checks the x86_64-pc-windows-msvc graph. Crates reached only on
# Linux (accesskit's AT-SPI bridge over zbus) are not in it. If a Linux build is
# ever shipped, add its triple here; its advisories are then fixed at the root.
[graph]
all-features = false
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]

# dirs-sys -> option-ext. MPL-2.0 is file-level copyleft: it binds changes to
# option-ext's own files, which offrig uses unmodified.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

# egui's bundled fonts. Font licences cover the font files shipped in the binary.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

# Mozilla's CA root list, used by ureq's TLS.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[advisories]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
