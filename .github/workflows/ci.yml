name: ci

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "osv-scanner.toml"
      - "atlas/**"
      - ".github/workflows/**"
  # A required check runs on every pull request, with no paths filter.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # id-token is for the Codecov upload (OIDC, no stored token). This is the only job.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: System libraries for eframe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libxcb1-dev libgl1-mesa-dev

      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Coverage component
        run: rustup component add llvm-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Runs the whole test suite under instrumentation: this is the test step.
      - name: Test with coverage
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      # The bar: CI fails if line coverage drops under 90%. This is the gate; the
      # Codecov upload below is reporting only.
      - name: Coverage summary and gate (lines >= 90%)
        run: cargo llvm-cov report --summary-only --fail-under-lines 90

      # Fork pull requests get no OIDC token; the upload is skipped for them.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false

      - name: Dependency policy (licences, advisories, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Dependency scan (OSV, Cargo.lock)
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
