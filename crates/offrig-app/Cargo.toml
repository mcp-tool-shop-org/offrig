[package]
name = "offrig-app"
description = "offrig desktop app: run models on RunPod and wire them into Zed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "offrig-app"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
offrig-core.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
egui_kittest = "0.36.2"
serde_json = "1.0.151"

[lints]
workspace = true
