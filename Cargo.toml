[workspace]
members = ["crates/offrig-core", "crates/offrig-cli", "crates/offrig-app", "crates/offrig-mcp"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["mcp-tool-shop <64996768+mcp-tool-shop@users.noreply.github.com>"]
repository = "https://github.com/mcp-tool-shop-org/offrig"

[workspace.dependencies]
offrig-core = { path = "crates/offrig-core", version = "1.0.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
