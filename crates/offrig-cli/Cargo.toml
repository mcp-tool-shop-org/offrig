[package]
name = "offrig-cli"
description = "offrig command line: run models on RunPod and wire them into Zed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "offrig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
offrig-core.workspace = true
serde_json = "1.0.151"

[lints]
workspace = true
